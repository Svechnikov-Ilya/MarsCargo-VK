<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MarsCargo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #151515; font-family: sans-serif; touch-action: none; }
        #canvas { display: block; position: absolute; width: 100%; height: 100%; outline: none; touch-action: none; }
        #loading-overlay { position: absolute; inset: 0; z-index: 99; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px; color: #e9ad46; background: #151515; }
        #loading-track { width: 200px; height: 6px; overflow: hidden; border-radius: 3px; background: #303030; }
        #loading-progress { width: 0; height: 100%; background: #e9ad46; transition: width 0.1s linear; }
        #loading-message { max-width: 80vw; text-align: center; }
    </style>
    <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
    <canvas id="canvas" oncontextmenu="event.preventDefault();" tabindex="0"></canvas>
    <div id="loading-overlay" role="status">
        <div id="loading-message">MarsCargo</div>
        <div id="loading-track"><div id="loading-progress"></div></div>
    </div>
    <script src="index.js"></script>
    <script>
        const engine = new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":4164752,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
        const canvas = document.getElementById('canvas');
        window.addEventListener('pointerdown', () => canvas.focus({preventScroll: true}));
        engine.startGame({
            canvas,
            onProgress(current, total) {
                if (total > 0) document.getElementById('loading-progress').style.width = `${current / total * 100}%`;
            }
        }).then(() => {
            document.getElementById('loading-overlay').remove();
            canvas.focus({preventScroll: true});
        }).catch(error => {
            console.error('Failed to start MarsCargo:', error);
            document.getElementById('loading-message').textContent = 'Unable to load MarsCargo. Please reload the page.';
        });
    </script>
</body>
</html>
